name: clearo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Use these EXACT compatible versions
  firebase_core: 2.24.2
  firebase_auth: 4.16.0
  cloud_firestore: 4.14.0
  firebase_storage: 11.6.0
  
  # Maps & Charts
  google_maps_flutter: ^2.5.0
  fl_chart: ^0.68.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  
  # Utilities
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  image: ^3.2.0
  http: ^1.1.0
  location: ^5.0.3
  permission_handler: ^11.0.1
  mobile_scanner: ^3.5.2
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
 

flutter:
  uses-material-design: true
